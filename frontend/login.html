<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Login — Lops Carwash</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<main class="login-page">
  <div class="login-glow"></div>

  <div class="login-panel">
    <div class="login-logo">
      <span class="logo">LOPS<span class="dot"> CARWASH</span></span>
    </div>
    <p class="login-sub">Crew access · business management</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@lopscarwash.ph" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary login-btn">Login</button>
    </form>

    <div class="login-links">
      <a href="#">Forgot password?</a>
    </div>
  </div>

  <p class="login-footnote">Staff, manager & administrator access only</p>
</main>

<script src="js/main.js"></script>
</body>
</html>
